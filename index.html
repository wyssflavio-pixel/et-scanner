<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ET-Scanner – Tschopp</title>
<script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
<style>
:root{--g1:#1A5C1A;--g2:#2E7D2E;--g3:#4CAF50;--gl:#E8F5E8;--red:#E53935;--blue:#1565C0;--bl:#E3F2FD;--grey:#f4f6f4;--shadow:0 4px 20px rgba(0,0,0,.10);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--grey);min-height:100vh;}
.header{background:var(--g1);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-title{font-size:18px;font-weight:800;}
.header-sub{font-size:11px;opacity:.7;margin-top:2px;}
.user-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;display:none;}
.wrap{padding:14px;max-width:480px;margin:0 auto;}

/* LOGIN */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:30px;}
.btn-ms{background:#0078d4;color:#fff;border:none;border-radius:12px;padding:16px 24px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;max-width:360px;justify-content:center;}
.ms-logo{width:20px;height:20px;background:#fff;border-radius:3px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;flex-shrink:0;}
.ms-logo span{border-radius:1px;}
.ms-logo span:nth-child(1){background:#F25022;}
.ms-logo span:nth-child(2){background:#7FBA00;}
.ms-logo span:nth-child(3){background:#00A4EF;}
.ms-logo span:nth-child(4){background:#FFB900;}
.btn-ghost{margin-top:12px;background:none;border:1px solid #ddd;border-radius:12px;padding:12px;width:100%;max-width:360px;color:#888;font-size:13px;cursor:pointer;}

/* MAIN */
.main-screen{display:none;}
.tabs{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.tab{flex:1;padding:10px 4px;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;color:#999;cursor:pointer;transition:all .2s;}
.tab.on{background:var(--g1);color:#fff;}
.hidden{display:none!important;}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.card-title{font-size:12px;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}

/* SCANNER */
.scanner-wrap{position:relative;border-radius:16px;overflow:hidden;background:#000;margin-bottom:12px;}
#qr-video{width:100%;height:260px;object-fit:cover;display:block;}
.sf-corner{position:absolute;width:36px;height:36px;border-color:#4CAF50;border-style:solid;}
.sf-tl{top:50px;left:50%;transform:translateX(-90px);border-width:4px 0 0 4px;border-radius:4px 0 0 0;}
.sf-tr{top:50px;left:50%;transform:translateX(54px);border-width:4px 4px 0 0;border-radius:0 4px 0 0;}
.sf-bl{bottom:40px;left:50%;transform:translateX(-90px);border-width:0 0 4px 4px;border-radius:0 0 0 4px;}
.sf-br{bottom:40px;left:50%;transform:translateX(54px);border-width:0 4px 4px 0;border-radius:0 0 4px 0;}
/* Scan-Linie Animation */
.scan-line{position:absolute;left:50%;transform:translateX(-90px);width:180px;height:2px;background:linear-gradient(90deg,transparent,#4CAF50,transparent);animation:scanAnim 1.8s ease-in-out infinite;top:50%;}
@keyframes scanAnim{
  0%{top:55px;opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{top:215px;opacity:0;}
}
.scanner-status{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:500;}
.scanner-status.detecting{background:rgba(230,81,0,.85);}
.scanner-status.found{background:rgba(26,92,26,.9);}

/* MANUAL */
.manual-row{display:flex;gap:8px;margin-bottom:12px;}
.manual-row input{flex:1;padding:12px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;outline:none;}
.manual-row input:focus{border-color:var(--g2);}
.manual-row button{padding:12px 16px;background:var(--g1);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:700;}

/* ET CARD */
.et-nr{font-size:22px;font-weight:800;color:var(--g1);}
.et-bez{font-size:15px;font-weight:600;margin-top:2px;}
.et-anlage{font-size:12px;color:#777;margin-top:2px;margin-bottom:10px;}
.et-meta{font-size:12px;color:#555;margin-bottom:10px;line-height:1.8;background:#f9f9f9;border-radius:8px;padding:10px 12px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.badge-ok{background:#E8F5E8;color:var(--g2);}
.badge-warn{background:#FFF9C4;color:#E65100;}
.badge-crit{background:#FFEBEE;color:var(--red);}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.stat{background:var(--grey);border-radius:10px;padding:10px 6px;text-align:center;}
.stat-lbl{font-size:10px;color:#999;margin-bottom:3px;}
.stat-val{font-size:20px;font-weight:800;}
.ok{color:var(--g2);}.warn{color:#E65100;}.crit{color:var(--red);}

/* BUCHUNG */
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.type-btn{padding:14px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;cursor:pointer;text-align:center;transition:all .2s;font-size:13px;font-weight:600;color:#666;}
.type-btn.abgang{border-color:var(--red);background:#FFEBEE;color:var(--red);}
.type-btn.zugang{border-color:var(--blue);background:var(--bl);color:var(--blue);}
.type-icon{font-size:28px;display:block;margin-bottom:4px;}
.qty-row{display:flex;align-items:center;gap:12px;margin:14px 0;}
.qty-btn{width:52px;height:52px;border-radius:50%;border:none;font-size:30px;font-weight:700;cursor:pointer;}
.qty-btn:active{transform:scale(.9);}
.qty-minus{background:#FFE0E0;color:var(--red);}
.qty-plus{background:var(--gl);color:var(--g1);}
.qty-num{flex:1;text-align:center;font-size:44px;font-weight:800;color:var(--g1);border:2px solid #ddd;border-radius:12px;padding:8px 4px;}
.preview{text-align:center;font-size:13px;color:#666;margin-bottom:12px;}
.preview strong{font-size:18px;color:var(--g1);}

/* BUTTONS */
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn:active{transform:scale(.97);}
.btn-green{background:var(--g1);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-flat{background:#f0f0f0;color:#666;margin-top:8px;}

/* VERLAUF */
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:.5px solid #f0f0f0;}
.hist-item:last-child{border:none;}
.hist-nr{font-weight:700;font-size:14px;}
.hist-bez{font-size:12px;color:#888;}
.hist-time{font-size:11px;color:#bbb;margin-top:2px;}
.hist-delta{font-size:20px;font-weight:800;}
.hist-delta.out{color:var(--red);}
.hist-delta.in{color:var(--blue);}

/* LOADING */
.loading{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;}
.spinner{width:48px;height:48px;border:4px solid var(--gl);border-top-color:var(--g1);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:15px;color:var(--g1);font-weight:600;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:13px 22px;border-radius:30px;font-size:14px;font-weight:600;transition:transform .3s;z-index:9999;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.2);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:var(--g1);}
.toast.err{background:var(--red);}
.toast.info{background:var(--blue);}

/* SEITEN-NAVIGATION */
#page-detail{display:none;}
.back-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:#888;font-size:14px;font-weight:500;cursor:pointer;padding:4px 0;margin-bottom:14px;}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📦 ET-Scanner</div>
    <div class="header-sub">Tschopp Holzindustrie AG</div>
  </div>
  <div class="user-badge" id="user-badge">👤 <span id="user-name">–</span></div>
</div>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <img id="logo-img" alt="Tschopp Holzindustrie AG" style="width:280px;max-width:85%;margin-bottom:28px;" />
  <div style="font-size:13px;color:#888;text-align:center;margin-bottom:32px;line-height:1.7;">
    Plattenwerk · ET-Scanner
  </div>
  <button class="btn-ms" onclick="login()">
    <div class="ms-logo"><span></span><span></span><span></span><span></span></div>
    Mit Microsoft anmelden
  </button>
  <button class="btn-ghost" onclick="forceLogout()">🔄 Konten zurücksetzen</button>
</div>

<!-- MAIN -->
<div class="main-screen" id="main-screen">
  <div class="wrap">
    <div class="tabs">
      <button class="tab on" onclick="goTab('scan')">📷 Scan</button>
      <button class="tab" onclick="goTab('hist')">📋 Verlauf</button>
      <button class="tab" onclick="goTab('info')">ℹ️ Info</button>
    </div>

    <div id="tab-scan">

      <!-- SEITE 1: SCANNER -->
      <div id="page-scanner">
        <div class="scanner-wrap">
          <video id="qr-video" autoplay playsinline muted></video>
          <div class="sf-corner sf-tl"></div>
          <div class="sf-corner sf-tr"></div>
          <div class="sf-corner sf-bl"></div>
          <div class="sf-corner sf-br"></div>
          <div class="scan-line"></div>
          <div class="scanner-status" id="scan-status">Halte QR-Code in den Rahmen…</div>
        </div>
        <div class="manual-row">
          <input type="text" id="manual-et" placeholder="ET-Nr manuell eingeben" />
          <button onclick="manualSearch()">🔍</button>
        </div>
      </div>

      <!-- SEITE 2: ET + BUCHUNG -->
      <div id="page-detail">
        <button class="back-btn" onclick="resetScan()">← Zurück zum Scanner</button>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
            <div class="et-nr" id="et-nr">–</div>
            <span class="badge" id="et-badge">OK</span>
          </div>
          <div class="et-bez" id="et-bez">–</div>
          <div class="et-anlage" id="et-anlage">–</div>
          <div class="et-meta" id="et-meta">–</div>
          <div class="stats">
            <div class="stat"><div class="stat-lbl">Bestand</div><div class="stat-val" id="s-ist">–</div></div>
            <div class="stat"><div class="stat-lbl">Mindest</div><div class="stat-val ok" id="s-min">–</div></div>
            <div class="stat"><div class="stat-lbl">Maximal</div><div class="stat-val" id="s-max">–</div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Buchungstyp</div>
          <div class="type-row">
            <button class="type-btn abgang" id="type-abgang" onclick="setTyp('abgang')">
              <span class="type-icon">📤</span>Abgang<br><small>Teil entnommen</small>
            </button>
            <button class="type-btn" id="type-zugang" onclick="setTyp('zugang')">
              <span class="type-icon">📥</span>Zugang<br><small>Lieferung</small>
            </button>
          </div>
          <div class="card-title">Menge</div>
          <div class="qty-row">
            <button class="qty-btn qty-minus" onclick="chM(-1)">−</button>
            <div class="qty-num" id="m-num">1</div>
            <button class="qty-btn qty-plus" onclick="chM(1)">+</button>
          </div>
          <div class="preview" id="preview"></div>
          <button class="btn btn-green" id="btn-buchen" onclick="buchen()">✅ Abgang buchen</button>
          <button class="btn btn-flat" onclick="resetScan()">↩ Abbrechen</button>
        </div>
      </div>

    </div><!-- tab-scan -->

    <div id="tab-hist" class="hidden">
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:14px;display:flex;justify-content:space-between;align-items:center;">
          <span class="card-title" style="margin:0;">Buchungen</span>
          <button onclick="reloadData()" style="background:var(--gl);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--g1);cursor:pointer;">🔄 Neu laden</button>
        </div>
        <div id="hist-list"><div style="text-align:center;padding:30px;color:#ccc;font-size:14px;">Noch keine Buchungen</div></div>
      </div>
    </div>

    <div id="tab-info" class="hidden">
      <div class="card">
        <div class="card-title">Verbindung</div>
        <div style="font-size:14px;font-weight:600;color:var(--g1);" id="info-email">–</div>
        <div style="font-size:12px;color:#888;margin-top:4px;" id="info-file">–</div>
        <div style="font-size:12px;color:#888;margin-top:2px;" id="info-count">–</div>
      </div>
      <div class="card">
        <div class="card-title">Geladene ET-Nummern</div>
        <div id="info-keys" style="font-size:11px;color:#666;font-family:monospace;line-height:1.8;">–</div>
      </div>
      <button class="btn btn-green" onclick="reloadData()" style="margin-bottom:8px;">🔄 ET-Daten neu laden</button>
      <button class="btn" style="background:var(--red);color:#fff;" onclick="logout()">🚪 Abmelden</button>
    </div>

  </div>
</div>

<div class="loading hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">Laden…</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── KONFIGURATION ──
const CLIENT_ID = 'e3b6b827-701a-47d4-bcab-c0bc9d8569b0';
const TENANT_ID = '5ff1010c-565a-45ad-932a-b32c6606b8f7';
const SP_HOSTNAME = 'tschoppag.sharepoint.com';
const SP_SITE_PATH = '/sites/Instandhaltung';
const SP_FOLDER_PATH = '/Instandhaltung/ET-Liste';
const SP_FILENAME = 'ET-Liste_Tschopp_Final V2.xlsm';
const ET_SHEET = 'ET-Liste';
const FIRST_ROW = 5;
const MAIL_TO = 'flavio.wyss@tschopp.swiss';
const MAIL_CC = 'christopher.nagel@tschopp.swiss';
const REDIRECT = window.location.origin + window.location.pathname;

const msalConfig = {
  auth:{ clientId:CLIENT_ID, authority:'https://login.microsoftonline.com/'+TENANT_ID, redirectUri:REDIRECT },
  cache:{ cacheLocation:'localStorage', storeAuthStateInCookie:true }
};
const msalInst = new msal.PublicClientApplication(msalConfig);
const SCOPES = ['Files.ReadWrite','Sites.ReadWrite.All','User.Read','Mail.Send'];

let token='', siteId='', driveId='', fileId='';
let userEmail='', userName='';
let currentET=null, menge=1, buchTyp='abgang';
let etData={}, bookings=[];
let codeReader=null;

// Scanner
const COOLDOWN_MS = 2500;
const CONFIRM_COUNT = 1; // sofort beim ersten Erkennen
let consecutiveCount=0, lastRawCode='';
let cooldownActive=false, cooldownTimer=null;

function startCooldown(){
  cooldownActive=true;
  cooldownTimer=setTimeout(()=>{
    cooldownActive=false;
    if(!currentET) setScanStatus('Halte QR-Code in den Rahmen…','');
  }, COOLDOWN_MS);
}
function clearCooldown(){
  cooldownActive=false;
  if(cooldownTimer){clearTimeout(cooldownTimer);cooldownTimer=null;}
}
function setScanStatus(txt, cls){
  const el=document.getElementById('scan-status');
  el.textContent=txt;
  el.className='scanner-status'+(cls?' '+cls:'');
}
function resetScannerState(){
  consecutiveCount=0; lastRawCode='';
  clearCooldown();
  setScanStatus('Halte QR-Code in den Rahmen…','');
}

// ── AUTH ──
window.onload = async () => {
  // Logo laden
  loadLogo();
  try{
    await msalInst.initialize();
    const resp = await msalInst.handleRedirectPromise();
    if(resp){
      token=resp.accessToken; userEmail=resp.account.username;
      userName=resp.account.name||userEmail.split('@')[0];
      await afterLogin();
    } else {
      const accs = msalInst.getAllAccounts();
      if(accs.length>0){
        try{
          const sr=await msalInst.acquireTokenSilent({scopes:SCOPES,account:accs[0]});
          token=sr.accessToken; userEmail=accs[0].username;
          userName=accs[0].name||userEmail.split('@')[0];
          await afterLogin();
        }catch(e){ showLogin(); }
      } else { showLogin(); }
    }
  }catch(e){ showLogin(); }
};

async function refreshToken(){
  const accs=msalInst.getAllAccounts();
  if(accs.length>0){
    try{
      const sr=await msalInst.acquireTokenSilent({scopes:SCOPES,account:accs[0]});
      token=sr.accessToken;
    }catch(e){}
  }
}
async function gGet(url){
  await refreshToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{headers:{Authorization:'Bearer '+token}});
  if(!r.ok){const t=await r.text();throw new Error('GET '+r.status+' | '+t.substring(0,150));}
  return r.json();
}
async function gPatch(url,body){
  await refreshToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{
    method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  if(!r.ok){const t=await r.text();throw new Error('PATCH '+r.status+' | '+t.substring(0,150));}
  return r.json();
}
async function gPost(url,body){
  await refreshToken();
  const r=await fetch('https://graph.microsoft.com/v1.0'+url,{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  return r.status;
}

// ── DATEN ──
async function loadETData(){
  try{
    document.getElementById('info-file').textContent='🔍 Verbinde…';
    const site=await gGet('/sites/'+SP_HOSTNAME+':'+SP_SITE_PATH);
    siteId=site.id;
    const drive=await gGet('/sites/'+siteId+'/drive');
    driveId=drive.id;
    const items=await gGet('/drives/'+driveId+'/root:'+SP_FOLDER_PATH+':/children');
    if(!items.value||!items.value.length) throw new Error('Ordner leer');
    let file=items.value.find(it=>it.name&&it.name.toLowerCase()===SP_FILENAME.toLowerCase());
    if(!file) file=items.value.find(it=>it.name&&it.name.toLowerCase().endsWith('.xlsm'));
    if(!file) throw new Error('Keine Datei');
    fileId=file.id;
    document.getElementById('info-file').textContent='📁 '+file.name;
    const range=await gGet('/drives/'+driveId+'/items/'+fileId+'/workbook/worksheets/'+ET_SHEET+'/range(address=\'A'+FIRST_ROW+':P5000\')');
    etData={}; let count=0;
    if(range.values){
      for(let i=0;i<range.values.length;i++){
        const row=range.values[i];
        const nr=row[0];
        if(!nr||!String(nr).toUpperCase().startsWith('ET')) continue;
        const nrStr=String(nr).trim();
        const obj={
          nr:nrStr, anlage:String(row[1]||''), bez:String(row[2]||''),
          lagerort:String(row[3]||''), lagerplatz:String(row[4]||''),
          ist:parseFloat(row[5])||0, min:parseFloat(row[6])||0, max:parseFloat(row[7])||0,
          einheit:String(row[9]||'Stk'), ekp:parseFloat(row[10])||0,
          hersteller:String(row[12]||''), lieferant:String(row[13]||''),
          artNr:String(row[14]||''), lz:String(row[15]||''), row:i+FIRST_ROW
        };
        etData[nrStr.replace(/-/g,'').toUpperCase()]=obj;
        etData[nrStr.toUpperCase()]=obj;
        count++;
      }
    }
    document.getElementById('info-count').textContent='✅ '+count+' ET-Teile geladen';
    document.getElementById('info-keys').textContent=Object.keys(etData).filter(k=>k.includes('-')).join('\n');
    toast('✅ '+count+' ET-Teile geladen','ok');
  }catch(e){
    document.getElementById('info-file').textContent='❌ '+e.message;
    toast('Fehler: '+e.message.substring(0,60),'err');
  }
}
async function reloadData(){ showLoading('Aktualisiere…'); await loadETData(); hideLoading(); }

// ── SCANNER ──
function startScanner(){
  try{
    if(codeReader){try{codeReader.reset();}catch(e){} codeReader=null;}
    resetScannerState();
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.QR_CODE]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    codeReader=new ZXing.BrowserMultiFormatReader(hints, 100); // 200ms scan interval
    // Rückkamera mit hoher Auflösung
    const constraints = {
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };
    codeReader.decodeFromConstraints(constraints,'qr-video',(result,err)=>{
      if(currentET||cooldownActive) return;
      if(result){
        const text=result.getText().trim();
        if(!text) return;
        if(text===lastRawCode){
          consecutiveCount++;
        } else {
          lastRawCode=text;
          consecutiveCount=1;
        }
        setScanStatus('🔍 '+text,'detecting');
        if(consecutiveCount>=CONFIRM_COUNT) processCode(text);
      } else {
        if(lastRawCode){
          consecutiveCount=0; lastRawCode='';
          setScanStatus('Halte QR-Code in den Rahmen…','');
        }
      }
    });
  }catch(e){
    setScanStatus('⚠️ Kamera nicht verfügbar','');
  }
}

function processCode(qrData){
  if(!qrData||currentET||cooldownActive) return;
  startCooldown();
  const raw=qrData.trim();
  const rawU=raw.toUpperCase();
  const rawN=rawU.replace(/-/g,'');
  let et=etData[rawU]||etData[rawN];
  if(!et){
    const nums=raw.replace(/[^0-9]/g,'');
    if(nums.length>=4) for(const k of Object.keys(etData)){if(k.replace(/[^0-9]/g,'')===nums){et=etData[k];break;}}
  }
  if(!et) for(const k of Object.keys(etData)){const a=String(etData[k].artNr||'').toUpperCase().trim();if(a&&a===rawU){et=etData[k];break;}}
  if(!et){
    setScanStatus('❌ Nicht gefunden: '+qrData,'');
    toast('❌ Nicht gefunden','err');
    navigator.vibrate&&navigator.vibrate([100,50,100]);
    return;
  }
  navigator.vibrate&&navigator.vibrate([80,40,160]);
  if(codeReader){try{codeReader.reset();}catch(e){} codeReader=null;}
  currentET=et; menge=1; buchTyp='abgang';
  setScanStatus('✅ '+et.nr,'found');
  zeigET(et);
}

function manualSearch(){
  const val=document.getElementById('manual-et').value.trim();
  if(!val) return;
  clearCooldown();
  processCode(val);
  document.getElementById('manual-et').value='';
}

function zeigET(et){
  document.getElementById('et-nr').textContent=et.nr;
  document.getElementById('et-bez').textContent=et.bez;
  document.getElementById('et-anlage').textContent=et.anlage||'–';
  document.getElementById('et-meta').innerHTML=
    (et.hersteller?'🏭 <b>Hersteller:</b> '+et.hersteller+'<br>':'')+
    (et.lieferant?'🚚 <b>Lieferant:</b> '+et.lieferant+'<br>':'')+
    (et.artNr?'🔢 <b>Art.-Nr.:</b> '+et.artNr+'<br>':'')+
    '📦 <b>Lager:</b> '+(et.lagerort||'–')+' / '+(et.lagerplatz||'–');
  document.getElementById('s-ist').textContent=et.ist;
  document.getElementById('s-min').textContent=et.min;
  document.getElementById('s-max').textContent=et.max;
  let status='OK', bc='badge-ok';
  if(et.ist===0){status='Kritisch';bc='badge-crit';}
  else if(et.ist<=et.min){status='Bestellen';bc='badge-warn';}
  document.getElementById('et-badge').textContent=status;
  document.getElementById('et-badge').className='badge '+bc;
  document.getElementById('s-ist').className='stat-val '+(status==='OK'?'ok':status==='Bestellen'?'warn':'crit');
  document.getElementById('m-num').textContent='1';
  updatePreview();
  // Seite wechseln
  document.getElementById('page-scanner').style.display='none';
  document.getElementById('page-detail').style.display='block';
  window.scrollTo(0,0);
}

function setTyp(typ){
  buchTyp=typ;
  document.getElementById('type-abgang').className='type-btn'+(typ==='abgang'?' abgang':'');
  document.getElementById('type-zugang').className='type-btn'+(typ==='zugang'?' zugang':'');
  const btn=document.getElementById('btn-buchen');
  btn.textContent=typ==='abgang'?'✅ Abgang buchen':'✅ Zugang buchen';
  btn.className='btn '+(typ==='abgang'?'btn-green':'btn-blue');
  updatePreview();
}
function chM(d){ menge=Math.max(1,menge+d); document.getElementById('m-num').textContent=menge; updatePreview(); }
function updatePreview(){
  if(!currentET) return;
  const neu=buchTyp==='abgang'?currentET.ist-menge:currentET.ist+menge;
  const sign=buchTyp==='abgang'?'−':'+';
  document.getElementById('preview').innerHTML='Bestand: '+currentET.ist+' '+sign+' '+menge+' = <strong>'+Math.max(0,neu)+'</strong>';
}

function resetScan(){
  currentET=null; menge=1; buchTyp='abgang';
  setTyp('abgang');
  document.getElementById('page-detail').style.display='none';
  document.getElementById('page-scanner').style.display='block';
  window.scrollTo(0,0);
  resetScannerState();
  startScanner();
}

async function buchen(){
  if(!currentET||!fileId) return;
  const neu=buchTyp==='abgang'?currentET.ist-menge:currentET.ist+menge;
  if(neu<0){toast('⚠️ Bestand wird negativ!','err');return;}
  let liveRow=currentET.row;
  showLoading('Speichere…');
  try{
    const range=await gGet('/drives/'+driveId+'/items/'+fileId+'/workbook/worksheets/'+ET_SHEET+'/range(address=\'A'+FIRST_ROW+':A5000\')');
    if(range.values) for(let i=0;i<range.values.length;i++){
      if(String(range.values[i][0]||'').trim().toUpperCase()===currentET.nr.toUpperCase()){liveRow=i+FIRST_ROW;break;}
    }
    await gPatch('/drives/'+driveId+'/items/'+fileId+'/workbook/worksheets/'+ET_SHEET+'/range(address=\'F'+liveRow+'\')',{values:[[neu]]});
    const altIst=currentET.ist;
    const k=currentET.nr.replace(/-/g,'').toUpperCase();
    if(etData[k]) etData[k].ist=neu;
    currentET.ist=neu;
    bookings.unshift({nr:currentET.nr,bez:currentET.bez,typ:buchTyp,menge,neu,altIst,
      time:new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}),user:userName});
    if(buchTyp==='abgang'&&neu<=currentET.min){showLoading('Sende Mail…');await sendeMail(currentET,neu);}
    hideLoading();
    toast('✅ '+currentET.nr+' '+(buchTyp==='abgang'?'−':'+')+menge+' → '+neu,'ok');
    resetScan();
  }catch(e){
    hideLoading();
    toast('⚠️ '+e.message.substring(0,60),'err');
  }
}

async function sendeMail(et,neuerIst){
  const bm=et.max-neuerIst;
  const datum=new Date().toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const html='<div style="font-family:Arial,sans-serif;max-width:560px;"><div style="background:#1A5C1A;color:#fff;padding:20px;border-radius:8px 8px 0 0;"><h2 style="margin:0;font-size:18px;">⚠️ Meldebestand erreicht</h2></div><div style="padding:20px;border:1px solid #ddd;border-top:none;border-radius:0 0 8px 8px;"><p><b>'+et.nr+'</b> – '+et.bez+'<br><small>'+et.anlage+'</small></p><p>Bestand: <b style="color:red;font-size:18px;">'+neuerIst+'</b> '+et.einheit+'<br>Mindest: '+et.min+' | Maximal: '+et.max+'<br><b>Bestellmenge: '+bm+' '+et.einheit+'</b></p><p>Lieferant: '+(et.lieferant||'–')+'<br>Art.-Nr.: '+(et.artNr||'–')+'<br>Lieferzeit: '+(et.lz||'–')+' Tage</p><p style="font-size:11px;color:#888;">👤 '+userName+' · '+datum+'</p></div></div>';
  try{
    await gPost('/me/sendMail',{message:{subject:'⚠️ MELDEBESTAND: '+et.nr+' – '+et.bez,
      body:{contentType:'HTML',content:html},
      toRecipients:[{emailAddress:{address:MAIL_TO}}],
      ccRecipients:[{emailAddress:{address:MAIL_CC}}]},saveToSentItems:true});
    toast('📧 Mail gesendet','info');
  }catch(e){}
}

function goTab(t){
  ['scan','hist','info'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['scan','hist','info'][i]===t));
  if(t==='hist') renderHist();
}
function renderHist(){
  const el=document.getElementById('hist-list');
  if(!bookings.length){el.innerHTML='<div style="text-align:center;padding:30px;color:#ccc;font-size:14px;">Noch keine Buchungen</div>';return;}
  el.innerHTML=bookings.map(b=>`<div class="hist-item"><div><div class="hist-nr">${b.nr}</div><div class="hist-bez">${b.bez}</div><div class="hist-time">🕐 ${b.time} · ${b.altIst}→${b.neu} · ${b.user}</div></div><div class="hist-delta ${b.typ==='abgang'?'out':'in'}">${b.typ==='abgang'?'−':'+'}${b.menge}</div></div>`).join('');
}
function showLoading(txt){document.getElementById('loading-text').textContent=txt||'Laden…';document.getElementById('loading').classList.remove('hidden');}
function hideLoading(){document.getElementById('loading').classList.add('hidden');}
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast '+(type==='ok'?'ok':type==='err'?'err':type==='info'?'info':'');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3200);
}
</script>
